name: Import BEA cost of living

# Run from the Actions tab. Nothing automatic: BEA publishes Regional Price
# Parities once a year, so this is a button you press when they do, not a
# schedule that burns minutes waiting for data that has not changed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report = inspect BEA and change nothing. write = generate the data file."
        required: true
        default: report
        type: choice
        options:
          - report
          - write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: the script uses only built-in fetch, so the job stays
      # a few seconds rather than a few minutes.
      - name: Run importer
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: node scripts/import-bea-col.mjs --${{ inputs.mode }}

      # Only reachable in write mode — report mode writes nothing, so there is
      # nothing to open a pull request about.
      - name: Open a pull request with the new data
        if: inputs.mode == 'write'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bea-city-data
          title: "Update city cost-of-living data from BEA"
          commit-message: "Update city cost-of-living data from BEA"
          body: |
            Generated by the **Import BEA cost of living** workflow.

            Check before merging:
            - the year on the figures is the one you expected
            - a city you know well has a plausible number
            - no city lost its figure and fell back to a placeholder
